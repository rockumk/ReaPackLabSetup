name: Publish ReaPackLabSetup stable-channel ARM64 package
on:
  push:
    paths:
      - '.github/workflows/publish-stable-arm64.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Reuse previously verified build from GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download 'v0.1.0-dev.2' --repo "$GITHUB_REPOSITORY" --pattern 'reaper_reapacklabsetup-arm64.dylib' --dir dist
          printf '%s  %s\n' '4ca19dec997d4d292415a301a2682880db57923a711e772494174618cab905d8' 'dist/reaper_reapacklabsetup-arm64.dylib' | sha256sum --check
          test "$(stat -c '%s' 'dist/reaper_reapacklabsetup-arm64.dylib')" -gt 100000
      - name: Publish version as normal stable-channel package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view 'v0.1.0' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Version v0.1.0 already exists; refusing to replace it."
            exit 1
          fi
          gh release create 'v0.1.0' 'dist/reaper_reapacklabsetup-arm64.dylib' --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'ReaPackLabSetup v0.1.0' --notes 'Stable-channel package of the existing tested-build-artifact from 0.1.0-dev.2 for macOS Apple Silicon. No binary rebuild: embedded build identity remains 0.1.0-dev.2. SHA-256: 4ca19dec997d4d292415a301a2682880db57923a711e772494174618cab905d8. Package is intended for controlled classroom testing; it has not been verified in all lab computers. Restart REAPER after installing or updating the extension.'
