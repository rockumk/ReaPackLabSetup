name: Publish verified ReaPackLabSetup v0.1.2 recovery release
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-recovery-012.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified signed Setup v0.1.2 artifact
        env:
          ARTIFACT_URL: 'https://sdmntpreastus3.oaiusercontent.com/files/00000000-68f8-8212-bf35-47736b1aca80/raw?se=2026-11-10T22%3A19%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=436660e6-fadf-5596-b321-0cf38e49c059&skoid=db055408-822b-485f-92f8-bfeb3ea92408&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-10T12%3A42%3A34Z&ske=2026-11-11T12%3A42%3A34Z&sks=b&skv=2026-02-06&sig=K9IGOGGRA%2B3lAZnpRbZyTwAJrnDOyvViQLsKq1S/tbQ%3D'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --max-time 60 "$ARTIFACT_URL" -o build.zip
          test "$(stat -c %s build.zip)" -gt 30000
          unzip -o build.zip -d dist
      - name: Validate exact signed binary
        run: |
          set -euo pipefail
          cd dist
          printf '%s  %s\n' 'bf38d2507b077482f01c33d357889c1d5ddb4cc383f2228fa427d594c227f863' 'reaper_reapacklabsetup-arm64.dylib' | sha256sum --check
          test "$(stat -c %s reaper_reapacklabsetup-arm64.dylib)" -eq 221216
          grep -aFq '0.1.2' reaper_reapacklabsetup-arm64.dylib
          file reaper_reapacklabsetup-arm64.dylib
      - name: Publish Setup v0.1.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::v0.1.2 already exists; refusing to replace.'
            exit 1
          fi
          gh release create v0.1.2 dist/reaper_reapacklabsetup-arm64.dylib dist/ReaPackLabSetup-SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'ReaPackLabSetup v0.1.2 — classroom bootstrap recovery' \
            --notes 'Developer ID-signed, not notarized; macOS 15+ ARM64. This temporary recovery Setup checks for the latest approved ReaPackLab extension once per REAPER launch even when an older main extension is already loaded. It avoids unnecessary replacement when installed file bytes match the release. When it updates ReaPackLab, restart REAPER. ReaPackLab 0.14.4 bypasses a malformed local url.txt using a one-line online pointer from ReaPackLab-Config/bootstrap-url.txt. Signed source commit 2de85c94bbb1ff60f6f6b87ba87f948e167a906b and GitHub Actions run 42912517903. Exact SHA-256: bf38d2507b077482f01c33d357889c1d5ddb4cc383f2228fa427d594c227f863.'
