name: Publish ReaPackLabSetup macOS ARM64 development build
on:
  push:
    paths:
      - '.github/workflows/publish-arm64-dev2.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified build artifact
        env:
          ARTIFACT_URL: 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-766c-81f6-b2f2-e35668f6eb98/raw?se=2026-11-06T05%3A41%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=31af01ed-8bfc-58ff-8aa9-78a277e3d6c9&skoid=c36a4874-d531-4a8d-99fc-7da0d9143d9c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-06T03%3A35%3A52Z&ske=2026-11-07T03%3A35%3A52Z&sks=b&skv=2026-02-06&sig=8LbrkP45od4OMKTx70bKyQGA8miIL7uD0aJ8VbgU3EY%3D'
        run: |
          set -euo pipefail
          mkdir -p /tmp/reapacklabsetup
          curl --fail --location --silent --show-error --retry 3 "$ARTIFACT_URL" -o /tmp/reapacklabsetup.zip
          unzip -j /tmp/reapacklabsetup.zip -d /tmp/reapacklabsetup
          printf '%s  %s\n' '4ca19dec997d4d292415a301a2682880db57923a711e772494174618cab905d8' '/tmp/reapacklabsetup/reaper_reapacklabsetup-arm64.dylib' | sha256sum --check
          file /tmp/reapacklabsetup/reaper_reapacklabsetup-arm64.dylib
      - name: Publish prerelease asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v0.1.0-dev.2'
          ASSET='/tmp/reapacklabsetup/reaper_reapacklabsetup-arm64.dylib'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'ReaPackLabSetup v0.1.0-dev.2' --notes 'Development bootstrap build for macOS Apple Silicon (ARM64). Built from ReaPackLabDev commit 4ab782f8 in GitHub Actions run 42168274030. SHA-256: 4ca19dec997d4d292415a301a2682880db57923a711e772494174618cab905d8. Restart REAPER after it installs the managed extension. Test before classroom deployment.' --prerelease
          fi
